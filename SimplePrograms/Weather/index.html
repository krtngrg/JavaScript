<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌤 Weather App</h1>

        <form>
            <input type="text" name="city" id="city" placeholder="Enter city name">
            <button id="Btn">Search</button>
        </form>

        <div class="displaycard">
            <h2 class="cityDisplay"></h2>
            <p class="tempDisplay"></p>
            <p class="HumidDisplay"></p>
            <p class="emojiDisplay"></p>
            <p class="descpDisplay"></p>
            <label class="errorDisplay"></label>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
