<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <h1>Rock Paper Scissor</h1>
    <label for="">You vs Computer</label>

    <div class="space">
        <div id="rock" class="item"></div>
        <div id="paper" class="item"></div>
        <div id="scissor" class="item"></div>
    </div>

    <div class="board">
    You: <label id="you"> </label> vs 
    Computer: <label id="comp"> </label>
    </div>
    <div id="result">look like you found me</div>

    <div class="score">
        <div class="left"></div>
        <div class="right">
            Game Rule
            <ol>
                <li>Win: +10 points</li>
                <li>Loss: -10 points</li>
                <li>Draw: 0 points</li>
            </ol>
        </div>
    </div>
    <script src="index.js"></script>
   
</body>
</html>
